name: Build and Release
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.32.8

      - name: Install dependencies
        run: flutter pub get

      - name: Generate build files
        run: dart run build_runner build

      - name: Run unit tests
        run: flutter test

  build_android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.32.8

      - name: Install dependencies
        run: flutter pub get
      
      - name: Generate build files
        run: dart run build_runner build

      - name: Configure Android release signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          for secret_name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS
          do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${secret_name}"
              exit 1
            fi
          done

          mkdir -p android/keystores
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/keystores/btchess-release.jks

          {
            printf 'storePassword=%s\n' "$ANDROID_RELEASE_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_RELEASE_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_RELEASE_KEY_ALIAS"
            printf 'storeFile=../keystores/btchess-release.jks\n'
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK signing
        run: |
          set -euo pipefail
          build_tools_version="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$build_tools_version/apksigner" verify \
            --verbose \
            --print-certs \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_ios:
    name: Build iOS Unsigned
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.32.8

      - name: Install dependencies
        run: flutter pub get

      - name: Generate build files
        run: dart run build_runner build

      - name: Build iOS xcarchive
        run: flutter build ipa --release --no-codesign

      - name: Compress xcarchive
        run: cd build/ios/archive && tar -czf Runner.xcarchive.tar.gz Runner.xcarchive

      - name: Create unsigned IPA
        run: |
          set -euo pipefail

          app_path="build/ios/archive/Runner.xcarchive/Products/Applications"
          if [ ! -d "$app_path/Runner.app" ]; then
            echo "::error::Runner.app not found at $app_path"
            exit 1
          fi

          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R "$app_path/Runner.app" build/ios/ipa/Payload/Runner.app

          cd build/ios/ipa
          zip -0 -r btchess.ipa Payload

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: build/ios/ipa/btchess.ipa
